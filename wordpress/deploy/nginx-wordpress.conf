# nginx برای وردپرس دامون روی سرور خارجی (Ubuntu + PHP-FPM).
# نصب: این فایل را در /etc/nginx/conf.d/damoon.conf بگذارید، example.com و مسیرها را عوض کنید،
# سپس:  mkdir -p /var/cache/nginx/wp && nginx -t && systemctl reload nginx
# گواهی: certbot --nginx -d example.com -d www.example.com  (یا Origin Certificate کلادفلر)

# ---------- IP واقعی پشت Cloudflare ----------
# بدون این بخش، همهٔ بازدیدکننده‌ها IP کلادفلر دارند و محدودیت تلاش ورود همه را با هم قفل می‌کند.
# فهرست به‌روز: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---------- کش صفحه (FastCGI) ----------
fastcgi_cache_path /var/cache/nginx/wp levels=1:2 keys_zone=WP:64m max_size=1g inactive=60m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# ---------- محدودیت درخواست ----------
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=wp_api:10m rate=10r/s;

# صفحه‌هایی که نباید کش شوند: کاربر واردشده، سبد خرید ووکامرس، فرم‌ها، پیشخوان.
map $http_cookie $wp_skip_cookie {
	default 0;
	~*wordpress_logged_in|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session 1;
}
map $request_uri $wp_skip_uri {
	default 0;
	~*^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|wp-cron\.php) 1;
	# ووکامرس: نامک‌های فارسی در $request_uri درصدی‌اند؛ این صفحه‌ها هدر no-cache هم می‌فرستند که nginx رعایت می‌کند.
	~*/(cart|checkout|my-account)(/|$) 1;
	~*(sitemap|feed|robots\.txt) 1;
}

server {
	listen 80;
	listen [::]:80;
	server_name example.com www.example.com;
	location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
	location / { return 301 https://example.com$request_uri; }
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.example.com;
	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	return 301 https://example.com$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name example.com;

	root /var/www/damoon;
	index index.php;

	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	client_max_body_size 32m;
	server_tokens off;

	# ---------- فشرده‌سازی ----------
	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 512;
	gzip_proxied any;
	gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

	# ---------- فایل‌های حساس ----------
	location ~ /\.(?!well-known) { deny all; }
	location ~* ^/(wp-config\.php|readme\.html|license\.txt|wp-config-sample\.php)$ { deny all; }
	location = /xmlrpc.php { deny all; access_log off; }
	# هیچ فایل PHP در آپلودها اجرا نشود (رایج‌ترین راه نفوذ بعد از آپلود فایل مخرب).
	location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }
	location ~* ^/wp-includes/[^/]+\.php$ { deny all; }
	location ~* ^/wp-includes/js/tinymce/langs/.+\.php$ { deny all; }
	location ~* ^/wp-content/(plugins|themes)/.+\.(txt|md|log|sh|sql|zip|lock)$ { deny all; }

	# ---------- فایل‌های ثابت: کش طولانی در مرورگر و Cloudflare ----------
	location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|gif|webp|avif|mp4|webm)$ {
		add_header Cache-Control "public, max-age=31536000";
		add_header X-Content-Type-Options "nosniff";
		access_log off;
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location = /wp-login.php {
		limit_req zone=wp_login burst=4 nodelay;
		limit_req_status 429;
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.3-fpm.sock;
	}

	location ^~ /wp-json/ {
		limit_req zone=wp_api burst=40 nodelay;
		limit_req_status 429;
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf; # شامل try_files $fastcgi_script_name =404
		fastcgi_pass unix:/run/php/php8.3-fpm.sock;
		fastcgi_read_timeout 60s;

		# کش صفحه: بازدیدکننده‌های عادی HTML آماده می‌گیرند و PHP اجرا نمی‌شود.
		# تشخیص زبان در مرورگر انجام می‌شود، پس کش برای همهٔ کشورها درست است.
		set $wp_skip 0;
		if ($request_method = POST) { set $wp_skip 1; }
		if ($query_string != "") { set $wp_skip 1; }
		if ($wp_skip_cookie) { set $wp_skip 1; }
		if ($wp_skip_uri) { set $wp_skip 1; }
		fastcgi_cache WP;
		fastcgi_cache_valid 200 301 10m;
		fastcgi_cache_use_stale error timeout updating http_500 http_503;
		fastcgi_cache_background_update on;
		fastcgi_cache_lock on;
		fastcgi_cache_bypass $wp_skip;
		fastcgi_no_cache $wp_skip;
		add_header X-Cache $upstream_cache_status always;
	}
}
